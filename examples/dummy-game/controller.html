<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dummy game: controller</title>
<script src="https://www.airconsole.com/api/airconsole-1.11.0.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; gap: 12px; padding: 12px; box-sizing: border-box;
    background: #1d2b3a; color: #fff; font: 16px/1.3 system-ui, sans-serif; }
  #who { opacity: .8; }
  #tap { font-size: 22px; padding: 14px; border: 0; border-radius: 10px; background: #ffd166; color: #222; }
  #pad { flex: 1; width: 100%; background: #2c4157; border-radius: 10px; touch-action: none; }
  #last { min-height: 2.6em; font: 13px ui-monospace, monospace; word-break: break-all; }
</style>
</head>
<body>
<div id="who">connecting…</div>
<button id="tap">Tap me</button>
<canvas id="pad"></canvas>
<div id="last"></div>
<script>
  // Controller of the dummy game: a button and a drag pad. The pad uses pointer events (any pointer type) and
  // sends {type: 'drag', phase: 'start' | 'end', x, y, moves}; the screen answers taps with {type: 'echo'}.
  var airconsole = new AirConsole({ orientation: AirConsole.ORIENTATION_PORTRAIT });
  var events = [];
  var taps = 0;
  var stroke = null;

  function record(name, args) { events.push([name].concat(Array.prototype.slice.call(args))); }

  ['onConnect', 'onDisconnect', 'onDeviceStateChange', 'onCustomDeviceStateChange', 'onActivePlayersChange',
    'onAdShow', 'onAdComplete', 'onPremium', 'onDeviceMotion', 'onDeviceProfileChange'].forEach(function (name) {
    airconsole[name] = function () { record(name, arguments); };
  });

  airconsole.onReady = function () {
    record('onReady', arguments);
    document.getElementById('who').textContent = 'You are #' + airconsole.device_id + ' ' + airconsole.getNickname();
  };

  airconsole.onMessage = function (from, data) {
    record('onMessage', arguments);
    document.getElementById('last').textContent = JSON.stringify(data);
  };

  document.getElementById('tap').addEventListener('click', function () {
    taps++;
    airconsole.message(AirConsole.SCREEN, { type: 'tap', n: taps });
  });

  var pad = document.getElementById('pad');
  var ctx = pad.getContext('2d');
  function fit() { pad.width = pad.clientWidth; pad.height = pad.clientHeight; }
  window.addEventListener('resize', fit);
  fit();

  function point(e) {
    var r = pad.getBoundingClientRect();
    return { x: Math.round(e.clientX - r.left), y: Math.round(e.clientY - r.top) };
  }
  pad.addEventListener('pointerdown', function (e) {
    pad.setPointerCapture(e.pointerId);
    var p = point(e);
    stroke = { start: p, moves: 0, pointerType: e.pointerType };
    ctx.clearRect(0, 0, pad.width, pad.height);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    airconsole.message(AirConsole.SCREEN, { type: 'drag', phase: 'start', x: p.x, y: p.y, pointerType: e.pointerType });
  });
  pad.addEventListener('pointermove', function (e) {
    if (!stroke) return;
    var p = point(e);
    stroke.moves++;
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });
  function end(e) {
    if (!stroke) return;
    var p = point(e);
    airconsole.message(AirConsole.SCREEN, {
      type: 'drag', phase: 'end', x: p.x, y: p.y, dx: p.x - stroke.start.x, dy: p.y - stroke.start.y,
      moves: stroke.moves, cancelled: e.type === 'pointercancel'
    });
    stroke = null;
  }
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);
</script>
</body>
</html>
